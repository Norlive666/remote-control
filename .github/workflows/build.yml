name: Build and test
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: remote-control-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/test-results/
  stm32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host protocol and failsafe tests
        run: tests/c/run.sh
      - name: Cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev
      - name: Matching ST dependencies
        run: tools/fetch-stm32-deps.sh "$RUNNER_TEMP/stm32-deps"
      - name: Compile both MCU drivers
        env:
          STM32_H7_CUBE_DIR: ${{ runner.temp }}/stm32-deps/H7
          STM32_F1_CUBE_DIR: ${{ runner.temp }}/stm32-deps/F1
        run: tools/compile-stm32.sh
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/io.github.norlive.remotecontrol/files/controller.png ../controller.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-ui-results
          path: |
            controller.png
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
